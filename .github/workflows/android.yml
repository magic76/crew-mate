name: Android CI

on:
  push:
    branches: [ main, speech-audience-boundary ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crew Mate
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Contract tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
