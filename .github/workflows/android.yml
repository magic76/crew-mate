name: Android CI

on:
  push:
    branches: [ main, integrate-agent-harness ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Crew Mate
        uses: actions/checkout@v4
        with:
          path: crew-mate

      - name: Checkout shared Agent Harness
        uses: actions/checkout@v4
        with:
          repository: magic76/crew-agent-harness
          ref: b92902e7cf7f2b05cb8281ab408297dacf8347bb
          path: crew-agent-harness

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Contract tests and debug build
        working-directory: crew-mate
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
