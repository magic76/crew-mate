pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'com.github.magic76'
            }
        }
    }
}

rootProject.name = "CrewMate"
include ':app'

// Production/CI resolves Crew Agent Harness from JitPack.
// Optional local Harness development override:
//   gradle -PcrewHarnessLocal=true :app:testDebugUnitTest :app:assembleDebug
def localHarness = file('../crew-agent-harness')
def useLocalHarness = gradle.startParameter.projectProperties.get('crewHarnessLocal') == 'true'
if (useLocalHarness) {
    if (!localHarness.exists()) {
        throw new GradleException("-PcrewHarnessLocal=true requires ../crew-agent-harness")
    }
    includeBuild(localHarness) {
        dependencySubstitution {
            substitute module('com.github.magic76:crew-agent-harness') using project(':agent-core')
        }
    }
}
